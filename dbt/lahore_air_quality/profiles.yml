# Local/dev profile — passwords from environment only (see .env.example).
#   export DBT_PROFILES_DIR="/path/to/dbt/lahore_air_quality"
#   dbt debug

lahore_air_quality:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'lahore') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'lahore_aqi') }}"
      schema: public
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10
