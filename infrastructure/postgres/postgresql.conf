# Documented PostgreSQL tuning intent for local Lahore AQI development.
# Applied via docker-compose `command: postgres -c ...` overrides (not as a full
# replacement config_file, which would bypass the image's auth/HBA defaults).
#
# shared_buffers=256MB
# work_mem=16MB
# maintenance_work_mem=128MB
# wal_compression=on
# random_page_cost=1.1
#
# These favour append-heavy observation tables on a developer machine.
# Revisit before any production capacity planning.
