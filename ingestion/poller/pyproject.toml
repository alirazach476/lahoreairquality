[project]
name = "lahore-aqi-poller"
version = "0.1.0"
description = "Air quality and weather pollers that publish to Redpanda."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "confluent-kafka>=2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
lahore-aqi-poller = "lahore_aqi_poller.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lahore_aqi_poller"]
