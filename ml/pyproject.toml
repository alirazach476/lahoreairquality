[project]
name = "lahore-aqi-ml"
version = "0.1.0"
description = "Feature engineering, training, evaluation, and inference for Lahore AQI forecasts."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "statsmodels>=0.14",
  "xgboost>=2.0",
  "mlflow>=2.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lahore_aqi_ml"]
