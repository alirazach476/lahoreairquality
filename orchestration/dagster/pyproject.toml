[project]
name = "lahore-aqi-dagster"
version = "0.1.0"
description = "Dagster orchestration for Lahore AQI pipelines."
requires-python = ">=3.11"
dependencies = [
  "dagster>=1.7,<1.10",
  "dagster-webserver>=1.7,<1.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
lahore-aqi-dagster = "lahore_aqi_dagster.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lahore_aqi_dagster"]
